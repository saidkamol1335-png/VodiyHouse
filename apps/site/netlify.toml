# Сайт vodiyhouse.uz (PLAN §10). Сайт Netlify: Base directory — пусто (корень репозитория), Package
# directory — apps/site (монорепо npm workspaces). Кабинет — отдельный сайт Netlify из apps/admin.
# Документация Netlify «Monorepos»: установка и команда сборки — из корня, пути здесь — от корня.
# Netlify (тестовый деплой — решение фазы 3, Ф2; переезд к заказчику — шаг «Запуск»).
# Адаптер Next.js (OpenNext) Netlify подключает сам; переменные окружения — в настройках сайта
# Netlify, не здесь (.env.example: что нужно и откуда).
# Стенды /dev (DEMO мокапа зашито в код) из сборки убираем: иначе их пререндер с DEMO лежит в HTML,
# хотя страница отвечает 404 (аудит прода 03.11, release/project-1 958414c).
[build]
  command = "rm -rf apps/site/app/dev && npm run build -w @vh/site"
  publish = "apps/site/.next"
  # Сборка — только если менялся код сайта (кредиты Netlify, 03.11.2026): правка кабинета или
  # документов не пересобирает сайт. Ручной деплой и первая сборка (кэша нет) идут всегда.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/site packages/shared package.json package-lock.json'

[build.environment]
  NODE_VERSION = "24"

# Ролик первого экрана главной и его постеры (Higgsfield, 30.10.2026) — на год без перепроверки.
# Поэтому новый ролик кладётся в новую папку версии (components/HomeHero/assets.ts), а не поверх
# старых файлов: иначе вернувшийся посетитель до года видел бы старый ролик.
[[headers]]
  for = "/hero/timelapse/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
