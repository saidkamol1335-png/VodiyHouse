# Netlify (тестовый деплой — решение фазы 3, Ф2; переезд к заказчику — шаг «Запуск»).
# Адаптер Next.js (OpenNext) Netlify подключает сам; переменные окружения — в настройках сайта
# Netlify, не здесь (.env.example: что нужно и откуда).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Ролик первого экрана главной и его постеры (Higgsfield, 30.10.2026) — на год без перепроверки.
# Поэтому новый ролик кладётся в новую папку версии (components/HomeHero/assets.ts), а не поверх
# старых файлов: иначе вернувшийся посетитель до года видел бы старый ролик.
[[headers]]
  for = "/hero/timelapse/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
